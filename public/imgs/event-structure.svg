<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" width="900" height="430" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
    <marker id="ax" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="430" fill="#ffffff"/>

  <!-- axes -->
  <line x1="40" y1="352" x2="40" y2="40" stroke="#475569" stroke-width="2" marker-end="url(#ax)"/>
  <line x1="40" y1="352" x2="860" y2="352" stroke="#475569" stroke-width="2" marker-end="url(#ax)"/>
  <text x="26" y="200" font-size="20" fill="#475569" transform="rotate(-90 26 200)" text-anchor="middle">devices</text>
  <text x="450" y="378" font-size="20" fill="#475569" text-anchor="middle">time</text>

  <!-- message arrows -->
  <g stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)" fill="none">
