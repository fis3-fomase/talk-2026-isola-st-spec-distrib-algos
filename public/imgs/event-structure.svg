  </g>
  <text x="260" y="160" font-size="17" fill="#1e293b" text-anchor="middle" font-style="italic">&#949;</text>

  <!-- legend -->
  <g font-size="20" fill="#334155">
    <circle cx="150" cy="405" r="10" fill="#8ed99f" stroke="#475569" stroke-width="1.5"/>
    <text x="167" y="410">past of &#949;</text>
    <circle cx="300" cy="405" r="11" fill="#fde725" stroke="#1e293b" stroke-width="2"/>
    <text x="318" y="410">reference event</text>
    <circle cx="500" cy="405" r="10" fill="#7f94c8" stroke="#475569" stroke-width="1.5"/>
    <text x="517" y="410">future of &#949;</text>
    <circle cx="660" cy="405" r="10" fill="#cbd5e1" stroke="#475569" stroke-width="1.5"/>
    <text x="677" y="410">concurrent</text>
  </g>
