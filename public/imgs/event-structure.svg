    <path d="M123 70 L237 70"/><path d="M263 70 L417 70"/><path d="M443 70 L627 70"/>
    <!-- device 2 chain -->
    <path d="M103 130 L187 130"/><path d="M213 130 L317 130"/><path d="M343 130 L457 130"/>
    <path d="M483 130 L607 130"/><path d="M633 130 L747 130"/>
    <!-- device 3 chain -->
    <path d="M143 190 L247 190"/><path d="M273 190 L377 190"/><path d="M403 190 L527 190"/>
    <path d="M553 190 L687 190"/>
    <!-- device 4 chain -->
    <path d="M113 250 L217 250"/><path d="M243 250 L347 250"/><path d="M373 250 L487 250"/>
    <path d="M513 250 L637 250"/><path d="M663 250 L777 250"/>
    <!-- device 5 chain -->
    <path d="M163 310 L287 310"/><path d="M313 310 L447 310"/><path d="M473 310 L607 310"/>
    <path d="M633 310 L757 310"/>
    <!-- cross-device -->
    <path d="M117 82 L193 118"/>
    <path d="M108 262 L142 298"/>
    <path d="M160 298 L220 262"/>
    <path d="M208 142 L252 178"/>
    <path d="M232 238 L256 202"/>
    <path d="M268 178 L322 142"/>
    <path d="M268 202 L352 238"/>
    <path d="M340 118 L420 82"/>
    <path d="M368 262 L452 298"/>
    <path d="M440 82 L462 118"/>
    <path d="M468 298 L492 262"/>
    <path d="M478 142 L532 178"/>
    <path d="M504 238 L532 202"/>
    <path d="M548 178 L612 142"/>
    <path d="M548 202 L642 238"/>
    <path d="M628 298 L644 262"/>
    <path d="M628 118 L636 82"/>
    <path d="M658 262 L758 298"/>
    <path d="M708 178 L748 142"/>
  </g>

  <!-- events -->
  <g stroke="#475569" stroke-width="1.5">
    <!-- past -->
    <g fill="#8ed99f">
      <circle cx="110" cy="70" r="13"/>
      <circle cx="90" cy="130" r="13"/><circle cx="200" cy="130" r="13"/>
      <circle cx="130" cy="190" r="13"/>
      <circle cx="100" cy="250" r="13"/><circle cx="230" cy="250" r="13"/>
      <circle cx="150" cy="310" r="13"/>
    </g>
    <!-- concurrent -->
    <g fill="#cbd5e1">
      <circle cx="250" cy="70" r="13"/>
      <circle cx="300" cy="310" r="13"/>
    </g>
    <!-- future -->
    <g fill="#7f94c8">
      <circle cx="430" cy="70" r="13"/><circle cx="640" cy="70" r="13"/>
      <circle cx="330" cy="130" r="13"/><circle cx="470" cy="130" r="13"/>
      <circle cx="620" cy="130" r="13"/><circle cx="760" cy="130" r="13"/>
      <circle cx="390" cy="190" r="13"/><circle cx="540" cy="190" r="13"/>
      <circle cx="700" cy="190" r="13"/>
      <circle cx="360" cy="250" r="13"/><circle cx="500" cy="250" r="13"/>
      <circle cx="650" cy="250" r="13"/><circle cx="790" cy="250" r="13"/>
      <circle cx="460" cy="310" r="13"/><circle cx="620" cy="310" r="13"/>
      <circle cx="770" cy="310" r="13"/>
